<style>
/* Layout: header tóm tắt → thẻ lọc → khối cần xử lý → danh sách case gập/mở theo nhóm */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#1b2230; --muted:#5d6778; --line:#dde2ea;
  --ok:#1f7a4d; --ok-bg:#e5f4ec; --bad:#b4232c; --bad-bg:#fbe7e8; --accent:#2a5bd7;
  --code-bg:#eef1f6;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --fg:#e4e8ef; --muted:#9aa4b4; --line:#2b3340;
  --ok:#5fd19a; --ok-bg:#16301f; --bad:#ff8a8f; --bad-bg:#3a1a1d; --accent:#7ea3ff; --code-bg:#222a35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --fg:#e4e8ef; --muted:#9aa4b4; --line:#2b3340;
  --ok:#5fd19a; --ok-bg:#16301f; --bad:#ff8a8f; --bad-bg:#3a1a1d; --accent:#7ea3ff; --code-bg:#222a35; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 60px;display:grid;gap:22px}
h1{font:600 28px/1.15 var(--f-display);margin:0;text-wrap:balance}
h2{font:600 18px/1.3 var(--f-display);margin:0;letter-spacing:.01em}
.meta{color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px}
.meta b{color:var(--fg);font-weight:600}
code,.mono{font-family:var(--f-mono);font-size:12.5px}
code{background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;display:grid;gap:2px}
.card .n{font:600 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.card .l{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-1px}
.card:focus-visible{outline:2px solid var(--accent)}
.card.ok .n{color:var(--ok)} .card.bad .n{color:var(--bad)}
.todo{background:var(--bad-bg);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.todo ol{margin:0;padding-left:20px;display:grid;gap:6px}
.sec{display:grid;gap:8px}
.sec>h2{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px}
details[data-v="fail"]{border-left:4px solid var(--bad)}
details[data-v="pass"]{border-left:4px solid var(--ok)}
summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:44px 64px minmax(0,1fr);gap:10px;align-items:baseline}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--accent)}
.id{font:600 13px var(--f-mono);color:var(--muted)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;text-align:center}
.pill.pass{background:var(--ok-bg);color:var(--ok)} .pill.fail{background:var(--bad-bg);color:var(--bad)}
.t{min-width:0} .t small{display:block;color:var(--muted);font-size:13px}
.body{padding:0 14px 14px 14px;display:grid;gap:8px;min-width:0}
.body p{margin:0}
.k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
pre{background:var(--code-bg);border-radius:6px;padding:10px;margin:0;overflow-x:auto;font:12px/1.5 var(--f-mono)}
.foot{color:var(--muted);font-size:13px;display:grid;gap:6px}
.foot p{margin:0}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">

<!-- BODY: header .wrap > header + .cards + section.todo + section.sec>details[data-v=pass|fail][data-new] + .foot -->
<script>
(function(){
  var cards=document.querySelectorAll('.card'), items=document.querySelectorAll('details');
  function apply(f){
    items.forEach(function(d){
      var v=d.getAttribute('data-v');
      d.hidden = !(f==='all' || f===v || (f==='new' && d.getAttribute('data-new')==='1'));
    });
    cards.forEach(function(c){c.setAttribute('aria-pressed', c.dataset.f===f?'true':'false')});
  }
  cards.forEach(function(c){c.addEventListener('click',function(){apply(c.dataset.f)})});
})();
</script>
