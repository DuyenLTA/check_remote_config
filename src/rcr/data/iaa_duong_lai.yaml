# Duong lai bo IAA (`rcr-iaa chay`) theo KHUON (template app) - xem src/rcr/iaa_khuon.py.
# App chua khai: tool lai toi Home, chon khuon co `nhan_dien` khop chu tren Home -> chay luon, khong phai do duong lai.
# Buoc: src/rcr/iaa_lai.py (ve_chu / cho / back / mo_lai / dong_ad / shortcut / nhap / xem_ads_chu) va
# src/rcr/rating_cong_thuc.py (ve_man / dong_neu_co / tap / tap_duoi / cho_man / cho_chu / chon_anh / xem_ads).
# Lai CUNG duong cho ca 4 bien the. App lech chu: THEM chu cua app vao regex (A|B), dung tach muc rieng.

khuon:
  # App gen anh/video cung template (muc 3 sheet KT: native_loading, native_upload, native_i2i_i2v_prompt,
  # result_img_vid, reward_img_vid, inter_feature, inter_style, native_reason_uninstall, inter_uninstall).
  # Do 13/11/2026 tren vivo V2143: AIP893 2.6.0 (Home co nut "Text to Image Generate", hang style "AI Try On Outfits"),
  # AIP885 (Home "Magic With AI", the "Image to Image" + nut "Generate", hang "Trending", tab "Image/Video Studio").
  # Moi man trong MainActivity (Compose) -> nhan man bang chu. Ve Home hay co popup Add Widget / Rate us (Close).
  # Loading = chu "<so>%". Het luot gen free trong ngay -> doan reward/loading/result dung (KHONG mua sub).
  ai_photo:
    nhan_dien: "^(Text to Image Generate|Magic With AI)$"
    doan:
      - ten: Home (preload inter feature/style, banner reload 10s)
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI)$"
            tab: "^Home$"
            toi_da: 180
          - dong_neu_co: "^(Close|Close sheet)$"
          - cho: 35
      - ten: Image to Image bằng prompt (inter feature, native upload/prompt, reward, loading, result)
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI)$"
            tab: "^Home$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap: "^(Image to Image Generate|Image Studio)$"
          - dong_ad: 6
          - tap_neu_co: "^Generate$"           # AIP885: tab Image Studio -> the Image to Image (nut Generate thu 1)
            khi_thieu: "^(Tap To Upload|Upload( Image| Photo)?|Select Photo|Add Photo)$"
          - dong_ad: 6
          - cho_chu: "^(Tap To Upload|Upload( Image| Photo)?|Select Photo|Add Photo)$"
          - cho: 3
          - tap: "^(Tap To Upload|Upload|Upload Photo|Select Photo|Add Photo)$"   # khong khop nhan "Upload image" (chu, khong bam duoc)
          - chon_anh: true
          - tap_neu_co: "^Confirm( \\(\\d+/\\d+\\))?$"   # AIP885: man "Add photo" -> Confirm (1/1)
          - cho: 4
          - nhap: "a cat in space"
            o: "(What do you have in mind|Describe|[Ee]nter .*prompt|[Tt]ype .*prompt)"
          - tap: "^Generate$"
          - xem_ads_chu: "^(Watch Ads.*|Free Generate)$"     # khong khop tieu de "Unlock Your Creation" (AIP885)
            tap_tai: [0.5, 0.935]
            toi_chu: "^\\d{1,3}%$"
            dung_neu: "(Daily Free limit Reached|Daily Limit Reached)"
            toi_da: 420                                        # AIP885 "Watch Ads (0/5)": 5 reward lien tiep
          - cho: 25
      - ten: Text to Image (inter feature, màn nhập prompt preload reward/native loading)
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI)$"
            tab: "^Home$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap: "^(Text to Image Generate|Image Studio)$"
          - dong_ad: 6
          - tap_neu_co: "^Generate$"           # AIP885: tab Image Studio -> the Text to Image (nut Generate thu 2)
            thu: 2
            khi_thieu: "(What do you have in mind|Describe|[Ee]nter .*prompt|[Tt]ype .*prompt)"
          - dong_ad: 6
          - cho: 8
          - back: 1
      - ten: Image to Video bằng prompt
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI)$"
            tab: "^Home$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap: "^(Image to Video Generate|Video Studio)$"
          - dong_ad: 6
          - tap_neu_co: "^Generate$"           # AIP885: tab Video Studio -> the Image to Video + nut Generate
            khi_thieu: "^(Tap To Upload|Upload( Image| Photo)?|Select Photo|Add Photo)$"
          - dong_ad: 6
          - cho_chu: "^(Tap To Upload|Upload( Image| Photo)?|Select Photo|Add Photo)$"
          - cho: 3
          - tap: "^(Tap To Upload|Upload|Upload Photo|Select Photo|Add Photo)$"   # khong khop nhan "Upload image" (chu, khong bam duoc)
          - chon_anh: true
          - tap_neu_co: "^Confirm( \\(\\d+/\\d+\\))?$"
          - cho: 6
          - back: 1
      - ten: Style ở Home (inter style 1 lần/session, reward sau Confirm, loading)
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI)$"
            tab: "^Home$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap_duoi: "^(AI Try On Outfits|Trending)$"
          - dong_ad: 6
          - chon_anh: true
            toi_da: 40
          - tap_neu_co: "^Confirm( \\(\\d+/\\d+\\))?$"   # AIP885: man "Add photo" -> Confirm (1/1)
          - xem_ads_chu: "^(Watch Ads.*|Free Generate)$"     # khong khop tieu de "Unlock Your Creation" (AIP885)
            tap_tai: [0.5, 0.935]
            toi_chu: "^\\d{1,3}%$"
            dung_neu: "(Daily Free limit Reached|Daily Limit Reached)"
            toi_da: 420                                        # AIP885 "Watch Ads (0/5)": 5 reward lien tiep
          - cho: 25
      - ten: Style lần 2 cùng session (không được có inter)
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI)$"
            tab: "^Home$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap_duoi: "^(AI Try On Outfits|Trending)$"
            thu: 2
          - dong_ad: 6
          - cho: 6
          - back: 2
      - ten: Luồng Uninstall (shortcut launcher theo id - không gỡ thật)
        buoc:
          - shortcut: "(?i).*uninstall.*"     # id: uninstall / UNINSTALL / shortcut_uninstall; nhan "Gỡ cài đặt" tren may VN
          # AIP893 (Pixel 6 16/11/2026): shortcut mo lai app qua Splash -> Question -> Billing roi moi toi
          # UninstallActivity -> lai het FO, khong chi cho 8s (truoc do doan nay BACK khi con o Question, 0 request).
          - ve_man: "UninstallActivity"
            toi_da: 150
          - cho: 8
          - dong_ad: 6
          - cho: 4
          - back: 3

  # App lam dep (muc 3 sheet KT: 501_home_banner, inter_back, reward_img_vid, inter_style, native_result_img_vid,
  # native_loading, native_reason_uninstall, inter_uninstall). Do 16/11/2026 tren Pixel 4: AIP892 BeautyGenie 2.2.0.
  # Moi man la Activity rieng (MainActivity / PhotoSelect / Processing / History / Result) -> buoc theo activity.
  # Home: hang style duoi "QUICK FIXES" (the Before/After), nut History (desc). Gen NGAM: Processing tu ve Home o giay
  # ~15, anh server 30-34s -> mo History, the "New" -> Result. Man Result co animation lap (dump can tat animator).
  beauty_genie:
    nhan_dien: "^QUICK FIXES$"
    doan:
      - ten: Home (banner reload 10s, preload inter style / inter back)
        buoc:
          - ve_man: "MainActivity"
            toi_da: 180
          - dong_neu_co: "^(Close|Not now)$"
          - cho: 35
      - ten: Style lần 1 (inter style), Upload ảnh (preload reward, native loading), back (không inter back liền sau inter style)
        buoc:
          - ve_man: "MainActivity"
          - dong_neu_co: "^(Close|Not now)$"
          - tap_duoi: "^QUICK FIXES$"
          - dong_ad: 6
          - cho_man: "PhotoSelect"
            toi_da: 40
          - cho: 6
          - back: 1
          - dong_ad: 6
          - cho: 5
      - ten: Style lần 2 cùng session (không inter style), back ở Upload (inter back)
        buoc:
          - ve_man: "MainActivity"
          - dong_neu_co: "^(Close|Not now)$"
          - tap_duoi: "^QUICK FIXES$"
            thu: 2
          - dong_ad: 6
          - cho_man: "PhotoSelect"
            toi_da: 40
          - cho: 6
          - back: 1
          - dong_ad: 8
          - cho: 5
      - ten: Gen ảnh bằng style (reward, native loading reload 5s, native result qua History)
        buoc:
          - ve_man: "MainActivity"
          - dong_neu_co: "^(Close|Not now)$"
          - tap_duoi: "^QUICK FIXES$"
          - dong_ad: 6
          - cho_man: "PhotoSelect"
            toi_da: 40
          - tap_duoi: "^Sample$"
          - tap: "^Confirm$"
          - xem_ads: "^(Watch Ads \\(\\d/\\d\\)|Free Generate)$"
            toi: "Processing|Result"
            dung_neu: "^Daily Limit Reached$"
            toi_da: 200
          - cho_man: "MainActivity|ResultActivity"
            toi_da: 60
          - cho: 25
          - dong_neu_co: "^(Close|OK|Not now)$"
          - tap: "^History$"
            toi_da: 20
          - cho_man: "HistoryActivity|ResultActivity"
            toi_da: 20
          - tap: "^New$"
            toi_da: 60
          - cho_man: "ResultActivity"
            toi_da: 30
          - cho: 10
          - back: 2
          - dong_ad: 8
      - ten: Luồng Uninstall (shortcut launcher theo id - không gỡ thật)
        buoc:
          - shortcut: "(?i).*uninstall.*"
          # AIP892 (Pixel 6 17/11/2026): shortcut mo lai app qua Splash -> Question -> UninstallActivity; truoc day
          # chi cho 8s roi BACK khi con o Question -> doan bao "xong" ma chua toi man Uninstall nao.
          - ve_man: "UninstallActivity"
            toi_da: 150
          - cho: 8
          - dong_ad: 6
          - cho_chu: "^Still want to uninstall$"
          - tap: "^Still want to uninstall$"
          - cho_chu: "^Why do you uninstall\\?$"
          - cho: 6
          - tap: "^Too many ads$"
          - cho: 6
          # Bam Uninstall o man Why: app mo thang Settings > App info (KHONG bam Uninstall o day) -> BACK ve.
          # vivo V2143 (17/11/2026): nut Cancel / Uninstall co chu nhung bounds rong -> con o man Why thi bam toa do.
          - tap_neu_co: "^Uninstall$"
          - tap_toa_do: [0.724, 0.959]
            neu_co: "^Why do you uninstall\\?$"
          - dong_ad: 8
          - cho: 4
          - back: 3

  # App fitness (muc 3 sheet KT: banner_home, inter_home, reward_nutrition, inter_back, native_reason_uninstall,
  # inter_uninstall). Do 16/11/2026 tren vivo V2143: AIP921 Fitatics 1.1.0. Moi man trong MainActivity (Compose);
  # nut "Continue" / tab Workout - Nutrition co chu nhung bounds rong -> `tap_toa_do`. Sau pm clear, FO xong con
  # 5 buoc thiet lap ho so (ten / muc tieu / co the / van dong / Enter app). Home co popup Add Widget (Close) va
  # popup rate (nut X khong co node). Inter cach nhau 30s -> `cho: 31` truoc moi lan bam can thay inter.
  fitness:
    nhan_dien: "^Collections$"
    doan:
      - ten: Thiết lập hồ sơ lần đầu (sau pm clear)
        buoc:
          - cho: 3
          - nhap: "Test"
            o: "^Your name$"
            neu_co: "^What's your name\\?$"
          - tap_toa_do: [0.5, 0.943]
            neu_co: "^(Continue|Enter app)$"
          - tap_neu_co: "^(Lose fat|Stay fit)$"
          - tap_toa_do: [0.5, 0.943]
            neu_co: "^(Continue|Enter app)$"
          - tap_toa_do: [0.5, 0.943]
            neu_co: "^(Continue|Enter app)$"
          - tap_neu_co: "^(Sedentary|Light)$"
          - tap_toa_do: [0.5, 0.943]
            neu_co: "^(Continue|Enter app)$"
          - tap_toa_do: [0.5, 0.943]
            neu_co: "^(Continue|Enter app)$"
            cho_sau: 5
          - dong_neu_co: "^Close$"
          - tap_toa_do: [0.845, 0.309]
            neu_co: "^Please rate us"
      - ten: Tập luyện · Home (banner reload 10s, preload inter home)
        buoc:
          - dong_neu_co: "^Close$"
          - tap_toa_do: [0.845, 0.309]
            neu_co: "^Please rate us"
          - tap_toa_do: [0.25, 0.943]
          - cho_chu: "^Collections$"
          - cho: 35
      - ten: Inter Home - bấm thẻ Collection, rồi bấm lại trong 30s (không được có inter)
        buoc:
          - tap_toa_do: [0.845, 0.309]
            neu_co: "^Please rate us"
          - tap: "^(Gym|Home Pilates|Fitness at Home)$"
          - dong_ad: 8
          - cho: 4
          - back: 1
          - dong_ad: 5
          - cho_chu: "^Collections$"
          - tap: "^(Home Pilates|Fitness at Home|Gym)$"
          - dong_ad: 6
          - cho: 3
          - back: 1
          - dong_ad: 5
      - ten: Dinh dưỡng · AI Scan - bấm Scan (inter home), chụp, BACK ở hub (inter back)
        buoc:
          - ve_chu: "^(Collections|Scan your meal|Meal plan)$"
            toi_da: 60
          - cap_quyen: android.permission.CAMERA
          - cho: 31
          - tap_toa_do: [0.75, 0.943]
          - cho_chu: "^Scan your meal$"
          - cho: 4
          - tap: "^Scan your meal$"
          - dong_ad: 8
          - cho_chu: "^Fit the dish in the frame"
          - tap_toa_do: [0.5, 0.917]
            cho_sau: 12
          - back: 1
          - cho_chu: "^Scan your meal$"
          - cho: 31
          - back: 1
          - dong_ad: 8
          - cho: 3
      - ten: Dinh dưỡng · AI Scan - hết lượt free thì Watch Ads (reward)
        buoc:
          - ve_chu: "^(Collections|Scan your meal|Meal plan)$"
            toi_da: 60
          - tap_toa_do: [0.75, 0.943]
          - cho_chu: "^Scan your meal$"
          - tap_neu_co: "^Scan your meal$"
            khi_thieu: "^Watch Ads.*"
          - dong_ad: 8
          - tap_toa_do: [0.5, 0.917]
            neu_co: "^Fit the dish in the frame"
            cho_sau: 12
          - back: 1
            neu_co: "^(Couldn't recognize this meal|Retake photo)$"
          - tap_neu_co: "^Scan your meal$"
            khi_thieu: "^Watch Ads.*"
          - dong_ad: 8
          - tap_toa_do: [0.5, 0.917]
            neu_co: "^Fit the dish in the frame"
            cho_sau: 12
          - back: 1
            neu_co: "^(Couldn't recognize this meal|Retake photo)$"
          - tap_neu_co: "^Scan your meal$"
            khi_thieu: "^Watch Ads.*"
          - dong_ad: 8
          - tap_toa_do: [0.5, 0.917]
            neu_co: "^Fit the dish in the frame"
            cho_sau: 12
          - back: 1
            neu_co: "^(Couldn't recognize this meal|Retake photo)$"
          - tap_neu_co: "^Scan your meal$"
            khi_thieu: "^Watch Ads.*"
          - dong_ad: 8
          - tap_toa_do: [0.5, 0.917]
            neu_co: "^Fit the dish in the frame"
            cho_sau: 12
          - back: 1
            neu_co: "^(Couldn't recognize this meal|Retake photo)$"
          - xem_ads_chu: "^Watch Ads.*"
            toi_chu: "^Fit the dish in the frame"
            toi_da: 240
          - cho: 3
          - back: 1
      - ten: Thực đơn gợi ý · Công thức món - bấm món (inter home), BACK ở công thức và ở thực đơn (inter back)
        buoc:
          - ve_chu: "^(Collections|Scan your meal|Meal plan)$"
            toi_da: 60
          - cho: 31
          - tap_toa_do: [0.75, 0.943]
          - cho_chu: "^Meal plan$"
          - tap: "^Meal plan$"
          - cho_chu: "^Breakfast · "
          - cho: 4
          - tap: "^Breakfast · "
          - dong_ad: 8
          - cho: 31
          - back: 1
          - dong_ad: 8
          - cho_chu: "^Breakfast · "
          - cho: 31
          - back: 1
          - dong_ad: 8
          - cho: 3
      - ten: Luồng Uninstall (shortcut launcher - không gỡ thật)
        buoc:
          - shortcut: "(?i).*uninstall.*"
          - cho: 8
          - dong_ad: 20
          - tap_neu_co: "^(Continue training|Scan a meal)$"
            cho_truoc: 4
          - tap_neu_co: "^Start Now$"
          - cho: 15                          # inter onboarding hien de len UninstallActivity: doi het dem nguoc
          - dong_ad: 20
          - cho_chu: "^Still want to uninstall$"
          - cho: 8
          - tap: "^Still want to uninstall$"
          - cho_chu: "^Why are you leaving\\?$"
          - cho: 6
          - tap: "^Too many ads$"
          - cho: 8
          - tap_toa_do: [0.726, 0.951]
            neu_co: "^Uninstall$"
            cho_sau: 3
          - cho: 15                          # inter uninstall: doi het dem nguoc roi moi dong (BACK som khong dong)
          - dong_ad: 20
          - cho: 3
          - back: 2

  # App hoc tieng Anh voi AI buddy (muc 3 sheet KT: banner all screens, inter feature, reward chat, native
  # AI Characters / conversation history, inter back o Chat, native uninstall, inter uninstall). Do 16/11/2026 tren
  # vivo V2143: AIP935 Lexi 1.2.0. Moi man trong MainActivity (Compose); tab duoi chi co content-desc ->
  # `tap_toa_do`. Home co popup Add Widget (Close). Chat: dem "3/3" luot free, het luot -> "Watch an ad (0/2) · +3
  # chats". Inter cach nhau 30s -> `cho: 31` truoc moi lan bam can thay inter. Man Uninstall theo ngon ngu may
  # (VN: "Vẫn muốn gỡ cài đặt" / "Quá nhiều quảng cáo" / nut "Gỡ cài đặt"); bam Gỡ cài đặt thi app mo
  # Thong tin ung dung cua Cai dat (khong go that) -> BACK.
  english_buddy:
    nhan_dien: "^(Today's Story|Chat with Foxy)$"
    doan:
      - ten: Home (banner reload 10s, preload inter feature)
        buoc:
          - ve_chu: "^Today's Story$"
            tab: "^Home$"
            toi_da: 180
          - dong_neu_co: "^Close$"
          - cho: 35
      - ten: Tab Stories / Notebook / Settings (banner từng tab, inter feature cách 30s)
        buoc:
          - ve_chu: "^Today's Story$"
            tab: "^Home$"
          - dong_neu_co: "^Close$"
          - cho: 31
          - tap_toa_do: [0.382, 0.911]
          - dong_ad: 6
          - cho: 12
          - cho: 31
          - tap_toa_do: [0.617, 0.911]
          - dong_ad: 6
          - cho: 12
          - cho: 31
          - tap_toa_do: [0.852, 0.911]
          - dong_ad: 6
          - cho: 12
          - tap_toa_do: [0.148, 0.911]
          - dong_ad: 6
      - ten: Truyện ở Home (inter feature), BACK
        buoc:
          - ve_chu: "^Today's Story$"
            tab: "^Home$"
          - dong_neu_co: "^Close$"
          - cho: 31
          - tap_toa_do: [0.5, 0.40]            # the truyen duoi "Today's Story" (ten truyen doi theo ngay)
          - dong_ad: 6
          - cho: 5
          - back: 1
          - dong_ad: 6
      - ten: Chat with Foxy (inter feature, preload reward/native/inter back), AI Characters (native), hết 3 lượt free -> reward, BACK (inter back)
        buoc:
          - ve_chu: "^Today's Story$"
            tab: "^Home$"
          - dong_neu_co: "^Close$"
          - cho: 31
          - tap: "^Chat now$"
          - dong_ad: 6
          - cho_chu: "^Change character$"
          - cho: 5
          - tap: "^Change character$"
          - cho_chu: "^AI Characters$"
          - cho: 25
          - back: 1
          - cho_chu: "^Change character$"
          - nhap: "hello"
            o: "^Type a message"
          - tap: "^Send$"
          - cho: 8
          - nhap: "hello"
            o: "^Type a message"
          - tap: "^Send$"
          - cho: 8
          - nhap: "hello"
            o: "^Type a message"
          - tap: "^Send$"
          - cho: 8
          - xem_ads_chu: "^Watch an ad \\(\\d/\\d\\)"
            toi_chu: "^3/3$"
            toi_da: 240
          - cho: 3
          - cho: 31
          - tap: "^Back$"                  # nut Back cua man Chat (BACK he thong chi an ban phim -> khong co inter back)
          - dong_ad: 8
          - cho: 3
      - ten: Luồng Uninstall (shortcut launcher theo id - không gỡ thật)
        buoc:
          - shortcut: "(?i).*uninstall.*"
          - ve_man: "UninstallActivity"
            toi_da: 150
          - cho: 8
          - tap: "^(Vẫn muốn gỡ cài đặt|Still want to uninstall)$"
          - cho_chu: "^(Vì sao bạn gỡ cài đặt\\?|Why .*uninstall.*\\?)$"
          - cho: 6
          - tap: "^(Quá nhiều quảng cáo|Too many ads)$"
          - cho: 8
          - tap: "^(Gỡ cài đặt|Uninstall)$"
          - cho: 15
          - back: 1
          - dong_ad: 20
          - cho: 3
          - back: 2

# Ghim khuon (khong bat buoc - app chua khai tool tu nhan khuon tren Home).
com.aiphotogenerator.aivideomaker.photoslideshow: {khuon: ai_photo}     # AIP893
com.ai.aiimage.aivideogenerator: {khuon: ai_photo}                      # AIP885
fitness.workout.aitraining.abs.exercises: {khuon: fitness}              # AIP921 (Home sau FO con man thiet lap ho so)
learnenglish.language.learningvocabulary.practice: {khuon: english_buddy}  # AIP935 Lexi
