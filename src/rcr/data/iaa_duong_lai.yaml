# Duong lai bo IAA (`rcr-iaa chay`) theo KHUON (template app) - xem src/rcr/iaa_khuon.py.
# App chua khai: tool lai toi Home, chon khuon co `nhan_dien` khop chu tren Home -> chay luon, khong phai do duong lai.
# Buoc: src/rcr/iaa_lai.py (ve_chu / cho / back / mo_lai / dong_ad / shortcut / nhap / xem_ads_chu) va
# src/rcr/rating_cong_thuc.py (ve_man / dong_neu_co / tap / tap_duoi / cho_man / cho_chu / chon_anh / xem_ads).
# Lai CUNG duong cho ca 4 bien the. App lech chu: THEM chu cua app vao regex (A|B), dung tach muc rieng.

khuon:
  # App gen anh/video "Kreivo AI" (muc 3 sheet KT kieu beauty_genie: 501_home_banner, inter_back, reward_img_vid,
  # inter_style, native_result_img_vid, native_loading, native_reason_uninstall, inter_uninstall). Do 20/11/2026 tren
  # Pixel 4 99261FFAZ0077C: AIP894 AI Photo Video 1.7.0. Moi man trong AiPhotoVideoMainActivity (Compose) -> nhan man
  # bang chu. Home: tieu de "Kreivo AI", carousel the "IMAGE TO IMAGE\nGENERATE" / "IMAGE TO VIDEO\nGENERATE" (bam the
  # KHONG co inter), hang style duoi "Trending Now" (bam -> inter style -> mo thang trinh chon anh -> sheet
  # "Watch Ads (0/2)"), History / Settings (desc). Nut Back (desc) o man I2I / I2V -> inter back.
  # Gen NGAM: sau 2 reward tu ve Home, anh xong -> History -> the "New" -> man "Result". Free 1 luot gen/ngay
  # ("Daily limit reached") -> doan gen dat SAU cac doan back.
  # Truoc khuon ai_photo: Home app nay cung co "Trending Now" (khop nham ai_photo, khong co the Text to Image).
  kreivo:
    nhan_dien: "^Kreivo AI$"
    doan:
      - ten: Home (banner reload 10s, preload inter back / inter style)
        buoc:
          - ve_chu: "^Kreivo AI$"
            tab: "^Home$"
            toi_da: 180
          - dong_neu_co: "^(Close|Close sheet|Not now|Maybe later)$"
          - cho: 35
      - ten: Màn Image to Image → Back (inter back preload ở Home)
        buoc:
          - ve_chu: "^Kreivo AI$"
            tab: "^Home$"
          - dong_neu_co: "^(Close|Close sheet|Not now|Maybe later)$"
          - tap: "^Image to Image\\sGenerate$"
          - dong_ad: 4
          - cho_chu: "^Tap to Upload$"
          - cho: 6
          - tap: "^Back$"
          - dong_ad: 8
          - cho: 5
      - ten: Màn Image to Video → Upload ảnh → Back (inter back reload ở màn I2V / Upload)
        buoc:
          - ve_chu: "^Kreivo AI$"
            tab: "^Home$"
          - dong_neu_co: "^(Close|Close sheet|Not now|Maybe later)$"
          - tap: "^Image to Video\\sGenerate$"
          - dong_ad: 4
          - cho_chu: "^Tap to Upload$"
          - cho: 3
          - tap: "^Tap to Upload$"
          - chon_anh: true
          - cho: 6
          - tap: "^Back$"
          - dong_ad: 8
          - cho: 5
      - ten: Style lần 1 (inter style), trình chọn ảnh → back (không inter back liền sau inter style)
        buoc:
          - ve_chu: "^Kreivo AI$"
            tab: "^Home$"
          - dong_neu_co: "^(Close|Close sheet|Not now|Maybe later)$"
          - tap_duoi: "^Trending Now$"
          - dong_ad: 8
          - cho: 6
          - back: 1
          - dong_ad: 6
          - cho: 5
      - ten: Style lần 2 cùng session (không inter style), trình chọn ảnh → back (inter back)
        buoc:
          - ve_chu: "^Kreivo AI$"
            tab: "^Home$"
          - dong_neu_co: "^(Close|Close sheet|Not now|Maybe later)$"
          - tap_duoi: "^Trending Now$"
            thu: 2
          - dong_ad: 8
          - cho: 6
          - back: 1
          - dong_ad: 8
          - cho: 5
      - ten: Image to Image upload + prompt (reward preload ở Upload, native loading, native result qua History)
        buoc:
          - ve_chu: "^Kreivo AI$"
            tab: "^Home$"
          - dong_neu_co: "^(Close|Close sheet|Not now|Maybe later)$"
          - tap: "^Image to Image\\sGenerate$"
          - dong_ad: 4
          - cho_chu: "^Tap to Upload$"
          - cho: 3
          - tap: "^Tap to Upload$"
          - chon_anh: true
          - cho: 4
          - nhap: "a cat in space"
            o: "What do you have in mind"
          - tap: "^Generate$"
          - xem_ads_chu: "^Watch Ads.*$"
            tap_tai: [0.5, 0.935]
            toi_chu: "^(\\d{1,3}%|Taking you to Home.*|Kreivo AI)$"
            dung_neu: "(?i)daily (free )?limit reached"
            toi_da: 300
          - cho: 40
          - tap: "^History$"
          - dong_ad: 6
          - tap: "^New$"
            toi_da: 60
          - cho_chu: "^Result$"
          - cho: 10
          - back: 2
          - dong_ad: 6
      - ten: Luồng Uninstall (shortcut launcher theo id - không gỡ thật)
        buoc:
          - shortcut: "(?i).*uninstall.*"
            nhan: "^(Uninstall|Uninstall app|Gỡ cài đặt)$"
          - ve_man: "UninstallActivity"
            toi_da: 150
          - cho: 8
          - dong_ad: 6
          - tap_neu_co: "^Still want to uninstall$"
          - cho_chu: "(?i)^Why (do you uninstall|are you uninstalling)"   # AIP894: "Why are you uninstalling?"
          - cho: 6
          - tap: "^Too many ads$"
          - cho: 6
          - tap: "^Uninstall$"
          - dong_ad: 8
          - cho: 4
          - back: 3

  # App gen anh/video "Hypix" (AIP933 2.3.0, do 20/11/2026 tren Pixel 7 29301FDH2006K7). Muc 3 sheet KT: native_loading,
  # native_i2i_i2v_prompt, result_img_vid, inter_feature, inter_style, native_reason_uninstall, inter_uninstall,
  # 501_home_banner. Moi man trong AIP933MainActivity (Compose). Home: "Hi dear" / "Hypix", carousel TU XOAY ~4s cac
  # the "Text to Image\nGenerate" / "Image to Image\nGenerate" / "Image to Video\nGenerate" (chu co xuong dong ->
  # regex dung \s), hang style "AI Film Filter" / "Trendy Haircuts", tab duoi AI Generate / AI Photos / AI Videos,
  # nut desc "History" goc tren phai. Ve Home hien popup "Add Widget" roi "Today's Check-In" (desc Close) -> dong 2 lan.
  # Man nhap prompt: o goi y "A pretty girl...", "Tap To Upload" -> photopicker he thong (Xong) -> Generate -> sheet
  # "Watch Ads (0/2)" (2 reward) -> gen ngam, tu ve Home; xong ~60s -> History -> the (▶ / Video) -> man "Result".
  # Style Home: bam the duoi "AI Film Filter" -> photopicker ngay -> sheet Watch Ads.
  # Uninstall: shortcut CHI dang khi `enabled_flow_uninstall=true` (server khai nham ten `flow_uninstall`) -> rc_them.
  # Shortcut mo Splash -> Question -> UninstallActivity ("We're sorry..." / "Chung toi rat tiec..."), nut "Still want
  # to uninstall" / "Van muon go cai dat" -> "Why do you uninstall?" / "Tai sao ban go cai dat?" (chon ly do, nut
  # Uninstall / "Go cai dat" -> inter) -> Thank You -> Cai dat. Chu theo ngon ngu app (FO chua chon -> tieng may).
  hypix:
    nhan_dien: "^Hypix$"
    rc_them:
      enabled_flow_uninstall: "true"
    doan:
      - ten: Home (preload inter feature/style, banner reload 10s)
        buoc:
          - ve_chu: "^Hypix$"
            tab: "^AI Generate$"
            toi_da: 180
          - dong_neu_co: "^(Close|Close sheet)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - cho: 35
      - ten: Image to Image bằng prompt (inter feature, native prompt reload sau upload, reward, native loading)
        buoc:
          - ve_chu: "^Hypix$"
            tab: "^AI Generate$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap: "^AI Photos$"
          - tap: '^Image to Image\sGenerate$'
            vua_hien: true                         # carousel tu xoay ~4s
            sau_chu: "^Image to Image$"            # Pixel 7 23/11/2026 van vao nham the ben canh -> BACK bam lai
            dong_sau_back: "^Close$"               # BACK tu T2I bat popup rate (nut Close) che carousel
            vuot_neu_vang: '\sGenerate$'          # carousel dung o the khac -> vuot (Pixel 7 23/11/2026)
            toi_da: 60                             # dump Pixel 7 ~2.5s/lan -> can nhieu luot bam lai
          - dong_ad: 6
          - cho_chu: "^Image to Image$"            # carousel xoay giua luc bam -> vao nham T2I thi doan HONG (bao ro)
          - cho_chu: "^Tap To Upload$"
          - cho: 8
          - tap: "^Tap To Upload$"
          - chon_anh: true
          - cho: 8
          - nhap: "a cat in space"
            o: "(A pretty girl|What do you have in mind)"
          - tap: "^Generate$"
          - dong_ad: 6
          - xem_ads_chu: "^(Watch Ads.*|Free Generate)$"
            tap_tai: [0.5, 0.935]
            toi_chu: '^(\d{1,3}%|Taking you to Home.*|Hypix)$'
            dung_neu: "(Daily Free limit Reached|Daily Limit Reached)"
            toi_da: 420
          - cho: 25
      - ten: Text to Image (inter feature, màn nhập prompt)
        buoc:
          - ve_chu: "^Hypix$"
            tab: "^AI Generate$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap: "^AI Photos$"
          - tap: '^Text to Image\sGenerate$'
            vua_hien: true                         # carousel tu xoay ~4s
            sau_chu: "^Text to Image$"             # van trung luc doi the (Samsung A13) -> vao I2I thi BACK bam lai
            dong_sau_back: "^Close$"               # BACK bat popup rate che carousel (Pixel 7 23/11/2026)
            vuot_neu_vang: '\sGenerate$'          # carousel dung o the khac -> vuot (Pixel 7 23/11/2026)
            toi_da: 60                             # dump Pixel 7 ~2.5s/lan -> 30s mac dinh chi du 1-2 luot bam lai
          - dong_ad: 6
          - cho_chu: "^Text to Image$"
          - cho: 8
          - back: 1
      - ten: Image to Video bằng prompt (inter feature, native prompt, reward, native loading)
        buoc:
          - ve_chu: "^Hypix$"
            tab: "^AI Generate$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap: "^AI Videos$"
          - tap: '^Image to Video\sGenerate$'
          - dong_ad: 6
          - cho_chu: "^Tap To Upload$"
          - cho: 8
          - tap: "^Tap To Upload$"
          - chon_anh: true
          - cho: 8
          - nhap: "a cat in space"
            o: "(A pretty girl|What do you have in mind)"
          - tap: "^Generate$"
          - dong_ad: 6
          - xem_ads_chu: "^(Watch Ads.*|Free Generate)$"
            tap_tai: [0.5, 0.935]
            toi_chu: '^(\d{1,3}%|Taking you to Home.*|Hypix)$'
            dung_neu: "(Daily Free limit Reached|Daily Limit Reached)"
            toi_da: 420
          - cho: 25
      - ten: Result qua History (native result)
        buoc:
          - ve_chu: "^Hypix$"
            tab: "^AI Generate$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - cho: 60                                  # video gen ~60-90s
          - tap: "^History$"
          - cho_chu: "^(▶|Image|Video)$"
            toi_da: 120
          - tap: "^(▶|Image)$"
          - cho_chu: "^Result$"
            toi_da: 30
          - cho: 10
          - back: 2
          - dong_ad: 6
      - ten: Style ở Home (inter style 1 lần/session, reward sau chọn ảnh, loading)
        buoc:
          - ve_chu: "^Hypix$"
            tab: "^AI Generate$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap_duoi: "^AI Film Filter$"
          - dong_ad: 6
          - chon_anh: true
            toi_da: 40
          - xem_ads_chu: "^(Watch Ads.*|Free Generate)$"
            tap_tai: [0.5, 0.935]
            toi_chu: '^(\d{1,3}%|Taking you to Home.*|Hypix)$'
            dung_neu: "(Daily Free limit Reached|Daily Limit Reached)"
            toi_da: 420
          - cho: 25
      - ten: Style lần 2 cùng session (không được có inter)
        buoc:
          - ve_chu: "^Hypix$"
            tab: "^AI Generate$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap_duoi: "^AI Film Filter$"
            thu: 2
          - dong_ad: 6
          - cho: 6
          - back: 2
      - ten: Luồng Uninstall (shortcut launcher theo id - không gỡ thật)
        buoc:
          - shortcut: "(?i).*uninstall.*"
            nhan: "^(Uninstall|Uninstall app|Gỡ cài đặt)$"
          - ve_man: "UninstallActivity"
            toi_da: 150
          - cho: 8
          - dong_ad: 6
          - tap: "^(Still want to uninstall|Vẫn muốn gỡ cài đặt)$"
          - cho_chu: '^(Why do you uninstall\?|Tại sao bạn gỡ cài đặt\?)$'
          - cho: 6
          - tap: "^(Too many ads|Quá nhiều quảng cáo)$"
          - cho: 6
          - tap: "^(Too slow.*|Quá chậm.*)$"        # chon ly do lan 2: khong duoc reload native nua
          - cho: 6
          - tap: "^(Uninstall|Gỡ cài đặt)$"
          - dong_ad: 8
          - cho: 4
          - back: 3

  # App gen anh/video cung template (muc 3 sheet KT: native_loading, native_upload, native_i2i_i2v_prompt,
  # result_img_vid, reward_img_vid, inter_feature, inter_style, native_reason_uninstall, inter_uninstall).
  # Do 13/11/2026 tren vivo V2143: AIP893 2.6.0 (Home co nut "Text to Image Generate", hang style "AI Try On Outfits"),
  # AIP885 (Home "Magic With AI", the "Image to Image" + nut "Generate", hang "Trending", tab "Image/Video Studio").
  # AIP944 1.5.0 (Pixel 7 18/11/2026): Home "AI Studio", the chu "Text to Image" / "Image to Image" / "Image to Video"
  # (bam the -> inter feature -> man Tap To Upload), hang style duoi "Trending Now", tab duoi "AI STUDIO".
  # Moi man trong MainActivity (Compose) -> nhan man bang chu. Ve Home hay co popup Add Widget / Rate us (Close).
  # Loading = chu "<so>%". Het luot gen free trong ngay -> doan reward/loading/result dung (KHONG mua sub).
  ai_photo:
    nhan_dien: "^(Text to Image Generate|Magic With AI|Trending Now)$"
    doan:
      - ten: Home (preload inter feature/style, banner reload 10s)
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI|Trending Now)$"
            tab: "^(Home|AI STUDIO)$"
            toi_da: 180
          - dong_neu_co: "^(Close|Close sheet)$"
          - cho: 35
      - ten: Image to Image bằng prompt (inter feature, native upload/prompt, reward, loading, result)
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI|Trending Now)$"
            tab: "^(Home|AI STUDIO)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap: "^(Image to Image Generate|Image Studio|Image to Image)$"
          - dong_ad: 6
          - tap_neu_co: "^Generate$"           # AIP885: tab Image Studio -> the Image to Image (nut Generate thu 1)
            khi_thieu: "^(Tap To Upload|Upload( Image| Photo)?|Select Photo|Add Photo)$"
          - dong_ad: 6
          - cho_chu: "^(Tap To Upload|Upload( Image| Photo)?|Select Photo|Add Photo)$"
          - cho: 3
          - tap: "^(Tap To Upload|Upload|Upload Photo|Select Photo|Add Photo)$"   # khong khop nhan "Upload image" (chu, khong bam duoc)
          - chon_anh: true
          - tap_neu_co: "^Confirm( \\(\\d+/\\d+\\))?$"   # AIP885: man "Add photo" -> Confirm (1/1)
          - cho: 4
          - nhap: "a cat in space"
            o: "(What do you have in mind|Describe|[Ee]nter .*prompt|[Tt]ype .*prompt)"
          - tap: "^Generate$"
          - xem_ads_chu: "^(Watch Ads.*|Free Generate)$"     # khong khop tieu de "Unlock Your Creation" (AIP885)
            tap_tai: [0.5, 0.935]
            toi_chu: "^(\\d{1,3}%|Taking you to Home.*)$"   # AIP944: style -> loading gen ngam "Taking you to Home in Ns"
            dung_neu: "(Daily Free limit Reached|Daily Limit Reached)"
            toi_da: 420                                        # AIP885 "Watch Ads (0/5)": 5 reward lien tiep
          - cho: 25
      - ten: Text to Image (inter feature, màn nhập prompt preload reward/native loading)
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI|Trending Now)$"
            tab: "^(Home|AI STUDIO)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap: "^(Text to Image Generate|Image Studio|Text to Image)$"
          - dong_ad: 6
          - tap_neu_co: "^Generate$"           # AIP885: tab Image Studio -> the Text to Image (nut Generate thu 2)
            thu: 2
            khi_thieu: "(What do you have in mind|Describe|[Ee]nter .*prompt|[Tt]ype .*prompt)"
          - dong_ad: 6
          - cho: 8
          - back: 1
      - ten: Image to Video bằng prompt
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI|Trending Now)$"
            tab: "^(Home|AI STUDIO)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap: "^(Image to Video Generate|Video Studio|Image to Video)$"
          - dong_ad: 6
          - tap_neu_co: "^Generate$"           # AIP885: tab Video Studio -> the Image to Video + nut Generate
            khi_thieu: "^(Tap To Upload|Upload( Image| Photo)?|Select Photo|Add Photo)$"
          - dong_ad: 6
          - cho_chu: "^(Tap To Upload|Upload( Image| Photo)?|Select Photo|Add Photo)$"
          - cho: 3
          - tap: "^(Tap To Upload|Upload|Upload Photo|Select Photo|Add Photo)$"   # khong khop nhan "Upload image" (chu, khong bam duoc)
          - chon_anh: true
          - tap_neu_co: "^Confirm( \\(\\d+/\\d+\\))?$"
          - cho: 6
          - back: 1
      - ten: Style ở Home (inter style 1 lần/session, reward sau Confirm, loading)
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI|Trending Now)$"
            tab: "^(Home|AI STUDIO)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap_duoi: "^(AI Try On Outfits|Trending|Trending Now)$"
          - dong_ad: 6
          - chon_anh: true
            toi_da: 40
          - tap_neu_co: "^Confirm( \\(\\d+/\\d+\\))?$"   # AIP885: man "Add photo" -> Confirm (1/1)
          - xem_ads_chu: "^(Watch Ads.*|Free Generate)$"     # khong khop tieu de "Unlock Your Creation" (AIP885)
            tap_tai: [0.5, 0.935]
            toi_chu: "^(\\d{1,3}%|Taking you to Home.*)$"   # AIP944: style -> loading gen ngam "Taking you to Home in Ns"
            dung_neu: "(Daily Free limit Reached|Daily Limit Reached)"
            toi_da: 420                                        # AIP885 "Watch Ads (0/5)": 5 reward lien tiep
          - cho: 25
      - ten: Style lần 2 cùng session (không được có inter)
        buoc:
          - ve_chu: "^(Text to Image Generate|Magic With AI|Trending Now)$"
            tab: "^(Home|AI STUDIO)$"
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap_duoi: "^(AI Try On Outfits|Trending|Trending Now)$"
            thu: 2
          - dong_ad: 6
          - cho: 6
          - back: 2
      - ten: Luồng Uninstall (shortcut launcher theo id - không gỡ thật)
        buoc:
          - shortcut: "(?i).*uninstall.*"     # id: uninstall / UNINSTALL / shortcut_uninstall; nhan "Gỡ cài đặt" tren may VN
            nhan: "^(Uninstall|Uninstall app|Gỡ cài đặt)$"      # Samsung A13 (AIP893 18/11/2026) che id/nhan trong dumpsys (***)
          # AIP893 (Pixel 6 16/11/2026): shortcut mo lai app qua Splash -> Question -> Billing roi moi toi
          # UninstallActivity -> lai het FO, khong chi cho 8s (truoc do doan nay BACK khi con o Question, 0 request).
          - ve_man: "UninstallActivity"
            toi_da: 150
          - cho: 8
          - dong_ad: 6
          - cho: 4
          - back: 3

  # App slideshow video AI (muc 3 sheet KT: inter_upload, native_generate, native_result, banner_navigation,
  # native_reason_uninstall, inter_uninstall). Khai 18/11/2026 tren Samsung A13 R58TB198BNN: AIP927 Pictifaze 1.1.0.
  # Home MainActivity: hang the template duoi "Slideshow" (desc "Cinematic Crossfade" / "Polaroid Memories" / "Vintage
  # Film Reel") -> inter_upload khi bam the -> SelectPhotoActivity (dien du 5 o anh moi bat "Generate with Ads") -> sheet
  # "Watch Ads (0/2)" -> GeneratingActivity (native_generate) -> gen ngam ~8s tu ve Home; video xong ~4-5 phut o History
  # -> ResultActivity (native_result). Cung duong voi rating_gen.yaml / checkin_cong_thuc.yaml cua app.
  pictifaze:
    nhan_dien: "^Slideshow$"
    doan:
      - ten: Home (preload inter upload, banner navigation reload 10s)
        buoc:
          - ve_man: "MainActivity"
            toi_da: 180
          - dong_neu_co: "^(Close|Close sheet)$"
          - cho: 35
      - ten: Chọn template (inter upload) → Generate (native generate) → Result (native result)
        buoc:
          - ve_man: "MainActivity"
            toi_da: 60
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap_duoi: "^Slideshow$"
          - dong_ad: 8
          - cho_man: "SelectPhoto"
          - dien_o_anh: "^Change$"
            nguon: "^Gallery$"
            xong: "^Generate with Ads$"
            toi_da: 240
          - tap: "^Generate with Ads$"
          - xem_ads: "^(Watch Ads.*|Free Generate.*)$"
            toi: "Generating|Result"
            dung_neu: "(Daily Free limit Reached|Daily Limit Reached)"
            toi_da: 300
          - cho: 15
          - cho_man: "ResultActivity|MainActivity"
            toi_da: 120
          - cho: 240                         # video gen ngam ~4-5 phut truoc khi mo duoc Result tu History
          - tap: "^History$"
            bo_qua_neu: "^Your video is ready$"
          - cho_man: "HistoryActivity"
            bo_qua_neu: "^Your video is ready$"
          - tap_duoi: "^History$"
            bo_qua_neu: "^Your video is ready$"
          - cho_man: "ResultActivity"
            toi_da: 90
          - cho: 10
          - back: 2
      - ten: Chọn template lần 2 (inter upload cách lần trước ≥ 30s)
        buoc:
          - ve_man: "MainActivity"
            toi_da: 60
          - dong_neu_co: "^(Close|Close sheet)$"
          - tap_duoi: "^Slideshow$"
            thu: 2
          - dong_ad: 8
          - cho: 6
          - back: 2
      - ten: Luồng Uninstall (shortcut launcher theo id - không gỡ thật)
