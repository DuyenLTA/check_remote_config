com.aiphotogenerator.aivideomaker.photoslideshow:
  # AIP893 AI Photo Video Slideshow 2.6.0 (16) do tren Samsung A13 Android 14 18/11/2026: app Compose - MOI man chung
  # AIP893AIPhotoVideoMakerMainActivity -> nhan man theo CHU (text, khong desc) bang `man_theo_chu` (ten man ao).
  # Bam the style o tab AI Photos / AI Videos mo thang trinh chon anh he thong (photopicker) -> chon anh + Done =
  # Confirm; Premium vao thang man cho "Your Photo is being processed..." / "<n>%". Popup "Taking you to Home in Ns"
  # + OK la cua so dialog rieng (log WindowManager: focus sang dialog = popup hien, Remove Window = ve Home).
  # History: o khong co desc, nhan Image/Video + "Untitled creation", dang tao co "Generating…". Ket qua: tieu de
  # "Result", nut Download (luu vao Download/, banner "Saved to your device" ~1-2s), thanh "Drag to compare".
  man_theo_chu:
    ProcessingScreen: "being processed|^\\d{1,3}%$|^Taking you to Home in"
    ResultScreen: "^Result$"
    HistoryScreen: "^History$"
  thu_muc_luu: "Download/"
  # TC gen ngam tao anh bang T2I (prompt dai): app co man T2I rieng. Worker bat dau NGAY khi bam Generate (T2I) ->
  # popup giay wait-3, ve Home giay wait (do wait=8: popup 5,15s). Style/I2I co buoc tai anh len ~5,5s TRUOC worker
  # ("Your Photo is being processed...") nen popup / ve Home tre ~5,5s so voi luc vao man cho.
  t2i:
    mo: "^Text to Image Generate$"
    o: "What do you have in mind"
    style_duoi: "^Choose your style$"
    nut: "^Generate$"
  # Push khi xong (app o nen): "Your creation is ready" / "Tap to view your result." (khuon chung). App con ban them
  # push "✨ Your photo is almost here" / "Tap to continue your track." - KHONG phai push xong, khong khop.

com.aiart.aivideogenerator.aiphotocreator.phototovideo:
  # AIP919 GeniAI / AI Photo Video Maker 2.1.0 (18) do tren Pixel 7 Android 15 21/11/2026: app Compose - moi man chung
  # AIP919AIPhotoVideoMakerMainActivity -> nhan man theo CHU. Thanh duoi chi co 2 tab "Image Studio" / "Video Studio"
  # (khong co tab Home: Home = tab Image Studio). Home mo ra da cuon qua the "Text to Image" / "Image to Image".
  # Icon History goc tren phai la View NAF (khong chu, khong desc) -> `nut_ao`. Man cho: "<n>%" + chu buoc
  # ("Masking & Layout…"). History: o co nhan "Image"/"Video" + "New". Ket qua: "Result", "Back to Home", "Download".
  tab_home: "^Image Studio$"
  tab_anh: "^Image Studio$"
  tab_video: "^Video Studio$"
  nut_ao:
    - desc: "History"
      khung: [807, 139, 923, 271]
      khi_chu: "^Explore styles$"
  man_theo_chu:
    ProcessingScreen: "^\\d{1,3}%$|^Taking you to Home in"
    ResultScreen: "^Result$"
    HistoryScreen: "^History$"
  t2i:
    mo: "^Text to Image$"
    o: "^A fox astronaut"
    style_duoi: "^Choose a style$"
    nut: "^Generate$"
  het_luot: "Today.s Free limit Reached|Daily [Ll]imit [Rr]eached"
