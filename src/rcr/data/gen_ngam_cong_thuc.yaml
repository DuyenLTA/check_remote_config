  het_luot: "Daily generation limit reached"
  het_luot_dong: "^Back to Home$"
  man_ket_qua: "ResultActivity"
  man_lich_su: "HistoryActivity"
  thu_muc_luu: "Movies/Pictifaze"
  luu: "^Save$"
  da_luu: "saved to gallery"
