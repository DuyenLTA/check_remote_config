# Chu tren man cua tab TC "gen ngam" (tao anh / video chay ngam), moi app mot muc theo package - `rcr-gen-ngam`.
# Gia tri la regex so voi text HOAC content-desc cua node. App moi cung khuon (AI photo/video gen) thi chep muc gan
# nhat roi sua chu; cach do tung case: docs/rc-check/gen-ngam-tu-lai.md.
#
#   tab_home / tab_anh / tab_video : nut thanh duoi (Home / tao anh / tao video)
#   lich_su      : nut mo History (desc)      badge: so canh nut History (text chi co so)
#   mau          : chu nam TREN anh mau o man chon anh -> bam o bam duoc dau tien ben duoi
#   xac_nhan     : nut tao (desc "Confirm")   man_chon_anh / man_cho / man_ket_qua / man_lich_su: activity
#   popup_dem    : chu popup dem nguoc ve Home (nhom 1 = so giay)   popup_ok: nut dong popup
#   toast_xong / toast_view : toast trong app khi tao xong + nut mo ket qua
#   push_dang_tao / push_xong : chu thong bao he thong (title / text) luc dang tao / khi xong
#   o_dang_tao / o_moi / o_loi : nhan tren o History;  het_luot: popup / toast het luot ngay
#   luu / da_luu : nut luu o Ket qua va chu sau khi luu;  thu_muc_luu: relative_path MediaStore
#   so_sanh      : thanh keo truoc/sau (I2I);  rate: popup danh gia (dong bang desc Close)
#   xin_quyen    : popup trong app xin quyen thong bao (nut Allow / Not now)
#   bo_dong      : dong Expected KHONG ap dung cho app (user chot 16/11/2026: bo khoi report, khong cham)
#
# AIP892 BeautyGenie 2.2.0 (16) do tren Pixel 6 13/11/2026 (luot bot gn-233521): Premium bam Confirm vao thang
# ProcessingActivity; anh I2I server mat 30-34s, video 45-250s; popup giay 12 (anh) / giay 5 (video), ve Home giay
# 15 / 8; toast "Your result is ready" + View tu an ~8s; push xong "Your result is ready" / "Tap to view it".
# KHUON CHUNG: moi app gen anh/video cung template dung chung `khuon_chung`; muc theo package chi ghi phan RIENG
# (toa do man, thu muc luu, giay popup theo Test Data, dong bo) va de len khuon chung. App lech chu thi THEM chu vao
# regex khuon chung (A|B), dung tach muc rieng (user chot 16/11/2026: doc cong thuc dung chung cho nhanh).
khuon_chung:
  tab_home: "^(Home|AI Studio)$"
  tab_anh: "^(Image Studio|Image|AI Photos)$"
  tab_video: "^(Video Studio|Video|AI Videos)$"
  lich_su: "^History$"
  mau: "^Sample$"
  popup_anh_giay: 12.4         # mac dinh theo Test Data TC (generating_wait 15 / 8): = wait - 3 + 0,4
  popup_video_giay: 5.4
  thu_muc_luu: "Pictures/"
  xac_nhan: "^Confirm$"
  man_chon_anh: "PhotoSelect|SelectPhoto|Picker|Gallery"
  man_cho: "Processing|Generating|Loading"
  man_ket_qua: "Result"
  man_lich_su: "History"
  man_home: "MainActivity"
  popup_dem: "Taking you to Home in (\\d+)\\s*s"
  popup_ok: "^OK$"
  toast_xong: "^Your (?:result|creation) is ready$"
  toast_view: "^View$"
  toast_dang_tao: "Generating, please wait"
  push_dang_tao: "Creating your content"
  push_xong: "(?:result|creation) is ready"
  o_dang_tao: "^Generating(?:\\.*|…)$"
  o_moi: "^New$"
  o_loi: "^Failed$"
  het_luot: "Daily [Ll]imit [Rr]eached"
  het_luot_dong: "^Back to Home$"
  luu: "^(Download in HD|Download)$"
  da_luu: "^(Saved|Saved to your device)$"
  so_sanh: "Draggable slider handle|Drag to compare"
  rate: "rate us"
  xin_quyen: "Get notified when it"
  xin_quyen_cho: "^Allow$"
  xin_quyen_khong: "^Not now$"
  widget: "^Add Widget$"
  chon_nhieu: "(\\d+) selected"
  xoa: "^Delete( \\(\\d+\\))?$"

