# Ten goi trong file TC -> node tren cay UI. DO THAT tren may, khong suy dien.
#
# TC viet bang ngon ngu cua nguoi ("icon SWIPE", "vung ad"), cay node thi mang
# ten cua lap trinh vien (`ob2Bb2SwipeLottie`, `nativeAdView`). Khong co bang
# nay thi moi dong ta UI deu ra "phai nhin mat", du anh va cay node da co san.
#
# Them dong moi khi gap ten moi - dung doan: id phai tung thay trong dump that.
elements:
  - name: icon swipe
    aliases: ["icon SWIPE", "swipe icon", "biểu tượng vuốt"]
    ids: [ob2Bb2SwipeLottie, ivSwipeOnboarding, lottieSwipe]
    texts: ["Swipe to Next"]

  - name: vùng quảng cáo
    aliases: ["vùng ad", "khu vực ads", "khu vực quảng cáo", "native ad", "vùng native"]
    ids: [nativeAdView, ad_media, shimmer_container_native, banner_container]

  - name: nút next onboarding
    aliases: ["nút Next", "button Next", "nút tiếp tục"]
    ids: [btnNextOnboarding, btnNext, btnContinue]
    texts: ["Next", "Get Started", "Get started"]

  - name: nhãn ads
    aliases: ["nhãn ads", "nhãn quảng cáo", "This action may contain ads"]
    texts: ["This action may contain ads"]

  - name: progress bar
    aliases: ["progress bar", "thanh tiến trình"]
    ids: [progressBar, pbLoading, progress_splash]

  # TC goi "layout_native_ads_language_1", APK 2.8.0 khong co layout ten do: man
  # Language 1 (LFO1) dung `layout_ad_native_lfo_1` (shimmer luc dang load cung
  # bo id). Cham theo CA BO id cua layout trong mot dump, khong phai mot id le.
  - name: layout native Language 1
    aliases: ["layout_native_ads_language_1", "layout native language 1", "layout_ad_native_lfo_1"]
    ids_all: [nativeAdView, ad_headline, ad_media, ad_call_to_action]

  # Nut X / so dem nguoc tren trang native full (OB3). `quan_sat` con tu nhan
  # theo nghia ten id (skip/close... - timeout/countdown...), content-desc, va
  # chu chi la so o vung tren man -> app moi thuong khong can them gi. Them id
  # o day khi app dat ten khong mang nghia (vd `iv1`). Do that: SDK VslTemplate4
  # (Piclux 2.8.0, AI Video Generator 1.6.0) dung btnSkip / btnTimeoutSkip.
  - name: nút X
    aliases: ["nút X", "button X", "nút đóng", "nút close"]
    ids: [btnSkip, btnClose, ivClose, imgClose, closeButton, ivCancel]

  - name: số đếm ngược
    aliases: ["số đếm ngược", "countdown", "đếm ngược"]
    ids: [btnTimeoutSkip, tvCountdown, tvTimer]
