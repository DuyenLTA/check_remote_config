# Cong thuc lai app cho tab TC "daily checkin" (act_checkin). Moi app mot muc theo package.
#
#   home       : regex ten activity Home cua app.
#   home_chu   : regex chu chi co tren Home (de biet da ve Home thuc su, khong con sheet / man tien trinh de len).
#   vao_unlock : cac buoc tu Home toi sheet unlock template (noi co Free Generate / Watch Ads). "{thu}" = template
#                thu may trong hang (A=1, B=2, C=3).
#   sheet_xong : regex chu chi hien khi sheet unlock da tai xong (Free Generate co hay khong chi ket luan sau luc nay).
#   lich_su    : cac buoc mo man History (bang chung gen xong), `moi_tao` = regex nhan thoi gian cua ban moi tao.
#
# Kieu buoc dung chung voi data/rating_gen.yaml (rating_cong_thuc): ve_man, dong_neu_co, tap, tap_duoi (+ thu),
# cho_man, cho_chu, chon_anh (trinh chon anh he thong: bam anh dau tien + Done).

com.aiphotogenerator.aivideomaker.photoslideshow: &ai_photo    # AIP893 - do 13/11/2026 tren Pixel 6, ban 2.6.0
  home: "MainActivity"
  home_chu: "^AI Try On Outfits$"
  vao_unlock:
    - ve_man: "MainActivity"
      toi_da: 60                 # ve Home hay gap inter (AdActivity) phai cho dong duoc (~15-30s); 20s qua ngan (16/11/2026)
    - dong_neu_co: "^(Close|Close sheet)$"
    - tap_duoi: "^AI Try On Outfits$"
      thu: "{thu}"
    - chon_anh: true
      toi_da: 30
  sheet_xong: "^Watch Ads"
  lich_su:
    - tap: "^History$"
    - cho_chu: "^History$"
  moi_tao: "just now|\\d+\\s*(?:second|minute)s?\\s+ago"

# AIP892 BeautyGenie 2.2.0 (16): Home co hang style duoi "QUICK FIXES" -> PhotoSelect -> anh "Sample" -> Confirm -> sheet
# "Watch Ads (0/2)" / "Free Generate" (cung duong gen anh cua rating_gen.yaml, khai 16/11/2026). History: o moi co nhan "New".
com.aimakeup.aifaceeditor.facemakeup.faceswap: &beauty
  home: "MainActivity"
  home_chu: "^QUICK FIXES$"
  vao_unlock:
    - ve_man: "MainActivity"
      toi_da: 60                 # ve Home hay gap inter (AdActivity) phai cho dong duoc (~15-30s); 20s qua ngan (16/11/2026)
    - dong_neu_co: "^Close$"
    - tap_duoi: "^QUICK FIXES$"
      thu: "{thu}"
    - cho_man: "PhotoSelect"
    - tap_duoi: "^Sample$"
    - tap: "^Confirm$"
  sheet_xong: "^(Watch Ads|Free Generate)"
  lich_su:
    - tap: "^History$"
    - cho_man: "HistoryActivity"
  moi_tao: "^New$"

# KHUON: app chua co muc rieng -> chon khuon co `nhan_dien` khop chu tren Home (src/rcr/cong_thuc_khuon.py).
khuon:
  beauty:
    nhan_dien: "^QUICK FIXES$"
    <<: *beauty
  ai_photo:
    nhan_dien: "^(Text to Image Generate|Magic With AI)$"
    <<: *ai_photo
