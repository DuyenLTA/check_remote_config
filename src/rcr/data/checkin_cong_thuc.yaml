# Cong thuc lai app cho tab TC "daily checkin" (act_checkin). Moi app mot muc theo package.
#
#   home       : regex ten activity Home cua app.
#   home_chu   : regex chu chi co tren Home (de biet da ve Home thuc su, khong con sheet / man tien trinh de len).
#   vao_unlock : cac buoc tu Home toi sheet unlock template (noi co Free Generate / Watch Ads). "{thu}" = template
#                thu may trong hang (A=1, B=2, C=3).
#   sheet_xong : regex chu chi hien khi sheet unlock da tai xong (Free Generate co hay khong chi ket luan sau luc nay).
#   lich_su    : cac buoc mo man History (bang chung gen xong), `moi_tao` = regex nhan thoi gian cua ban moi tao.
#
# Kieu buoc dung chung voi data/rating_gen.yaml (rating_cong_thuc): ve_man, dong_neu_co, tap, tap_duoi (+ thu),
# cho_man, cho_chu, chon_anh (trinh chon anh he thong: bam anh dau tien + Done).

com.aiphotogenerator.aivideomaker.photoslideshow: &ai_photo    # AIP893 - do 13/11/2026 tren Pixel 6, ban 2.6.0
  home: "MainActivity"
  home_chu: "^AI Try On Outfits$"
  vao_unlock:
    - ve_man: "MainActivity"
      toi_da: 60                 # ve Home hay gap inter (AdActivity) phai cho dong duoc (~15-30s); 20s qua ngan (16/11/2026)
    - dong_neu_co: "^(Close|Close sheet)$"
    - tap_duoi: "^AI Try On Outfits$"
      thu: "{thu}"
    - chon_anh: true
      toi_da: 30
  sheet_xong: "^Watch Ads"
  lich_su:
    - tap: "^History$"
    - cho_chu: "^History$"
  moi_tao: "just now|\\d+\\s*(?:second|minute)s?\\s+ago"

# AIP892 BeautyGenie 2.2.0 (16): Home co hang style duoi "QUICK FIXES" -> PhotoSelect -> anh "Sample" -> Confirm -> sheet
# "Watch Ads (0/2)" / "Free Generate" (cung duong gen anh cua rating_gen.yaml, khai 16/11/2026). History: o moi co nhan "New".
com.aimakeup.aifaceeditor.facemakeup.faceswap: &beauty
  home: "MainActivity"
  home_chu: "^QUICK FIXES$"
  vao_unlock:
    - ve_man: "MainActivity"
      toi_da: 60                 # ve Home hay gap inter (AdActivity) phai cho dong duoc (~15-30s); 20s qua ngan (16/11/2026)
    - dong_neu_co: "^Close$"
    - tap_duoi: "^QUICK FIXES$"
      thu: "{thu}"
    - cho_man: "PhotoSelect"
    - tap_duoi: "^Sample$"
    - tap: "^Confirm$"
  sheet_xong: "^(Watch Ads|Free Generate)"
  lich_su:
    - tap: "^History$"
    - cho_man: "HistoryActivity"
  moi_tao: "^New$"

# AIP927 Pictifaze 1.1.0 (3) - do 17/11/2026 tren Samsung A13 R58TB198BNN: Home "Slideshow" co hang the template
# (content-desc "Cinematic Crossfade" | "Polaroid Memories"; "Vintage Film Reel" nam hang duoi) -> SelectPhotoActivity
# CHINH LA man unlock template: nut "Generate with Ads" + "Free Generate (1 left)" + "1 of 1 free left" (khong co sheet).
# Phai dien du 5 o anh moi bat nut gen (giong rating_gen.yaml). History = icon content-desc "History" tren Home.
photoslideshow.videoslideshow.addimage.photogen:
  home: "MainActivity"
  home_chu: "^Slideshow$"
  vao_unlock:
    - ve_man: "MainActivity"
      toi_da: 60
    - dong_neu_co: "^(Close|Close sheet)$"
    - tap_duoi: "^Slideshow$"
      thu: "{thu}"
    - cho_man: "SelectPhoto"
    - dien_o_anh: "^Change$"
      nguon: "^Gallery$"
      xong: "^Generate with Ads$"
      toi_da: 240
  sheet_xong: "^(Generate with Ads|Free Generate)"
  lich_su:
    - tap: "^History$"
    - cho_man: "HistoryActivity"
  moi_tao: "just now|\\d+\\s*(?:second|minute)s?\\s+ago|Generating|Processing|\\d+%"

# AIP916 CreaPix 1.4.0 - do 18/11/2026 tren Samsung A13 R58TB198BNN: Home tab PHOTO, hang style duoi "TRENDING HAIR
# STYLE" (the chi co content-desc) -> inter style (ad test bo dem treo, cho_man tu dong) -> SelectPhotoActivity CHINH LA
# man unlock: "Generate with Ads" + "Free Generate (1 left)" (chi hien khi con luot checkin). Chua co anh thi nut bi
# disable -> "Add your photo" -> sheet "Choose Photo Source" -> Gallery -> photopicker -> Done. Gen ngam tu ve Home.
photomaker.image.editor.ai:
  home: "MainActivity"
  home_chu: "^TRENDING HAIR STYLE$"
  vao_unlock:
    - ve_man: "MainActivity"
      toi_da: 60
    - dong_neu_co: "^(Close|Close sheet|Not now|Maybe later)$"
    - tap: "^PHOTO$"
    - tap_duoi: "^TRENDING HAIR STYLE$"
      thu: "{thu}"
    - cho_man: "SelectPhoto"
      toi_da: 90
    - tap: "^Add your photo$"
    - tap: "^Gallery$"
      toi_da: 15
    - chon_anh: true
      toi_da: 30
  sheet_xong: "^(Generate with Ads|Free Generate)"
  lich_su:
    - tap: "^History$"
    - cho_man: "HistoryActivity"
  moi_tao: "just now|\\d+\\s*(?:second|minute)s?\\s+ago|Generating|Processing|\\d+%"

# AIP944 AI Photo Video Creator 1.5.0 (9) - do 18/11/2026 tren Pixel 7 29301FDH2006K7: Home Compose "AI Studio" co
# hang the "Trending Now" (content-desc "Cobalt Sweater" | "Winter Couple" | "XMas Dance") -> bam the bat inter (ad test
# bo dem treo o "1") -> mo thang photopicker he thong -> chon anh + "Xong" -> sheet "Just One More Step!!!" voi
# "Watch Ads (0/5)" / "Free Generate (1 left)". History = icon content-desc "History" tren Home (cung MainActivity,
# tieu de chu "History"; trong thi "No creations yet"). The thu 2 "Winter Couple" la template DOI: chon 1 anh + Xong
# thi app ve Home, KHONG mo sheet -> case can template B (R06 "Gen 2 lan") tool dung o "sheet khong tai xong"; do tay
# dung the 1 + the 3 ("XMas Dance", gen video) - do 18/11/2026.
com.ai.aiphoto.aivideo.creator.generator:
  home: "MainActivity"
  home_chu: "^Trending Now$"
  vao_unlock:
    - ve_man: "MainActivity"
      toi_da: 60
    - dong_neu_co: "^(Close|Close sheet)$"
    # Home doi khi tai loi ("Something went wrong while loading the content" + "Try again", mat hang Trending Now -
    # gap 1 lan sau doi ngay 18/11/2026, mo lai thi tai duoc) -> bam Try again roi doi hang the hien.
    - tap_neu_co: "^Try again$"
    - cho_chu: "^Trending Now$"
      toi_da: 45
    - tap_duoi: "^Trending Now$"
      thu: "{thu}"
    - cho_man: "photopicker"     # cho_man tu dong inter dang che (AdActivity) roi doi trinh chon anh
      toi_da: 60
    - chon_anh: true
      toi_da: 30
  sheet_xong: "^(Watch Ads|Free Generate)"
  lich_su:
    - tap: "^History$"
    - cho_chu: "^(No creations yet|Untitled creation|Generating.*)$"
  moi_tao: "just now|\\d+\\s*(?:second|minute)s?\\s+ago|Generating|Processing|\\d+%|Untitled creation"

# KHUON: app chua co muc rieng -> chon khuon co `nhan_dien` khop chu tren Home (src/rcr/cong_thuc_khuon.py).
khuon:
  beauty:
    nhan_dien: "^QUICK FIXES$"
    <<: *beauty
  ai_photo:
    nhan_dien: "^(Text to Image Generate|Magic With AI)$"
    <<: *ai_photo
