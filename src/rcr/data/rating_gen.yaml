    - tap: "^AI Videos$"
    - tap: '^Image to Video\sGenerate$'
    - dong_ad: 6
    - cho_chu: "^Tap To Upload$"
    - cho: 3
    - tap: "^Tap To Upload$"
    - chon_anh: true
    - cho: 6
    - nhap: "a cat walking"
      o: "(A pretty girl|What do you have in mind)"
    - tap: "^Generate$"
    - dong_ad: 6
    - xem_ads_chu: "^(Watch Ads.*|Free Generate)$"
      tap_tai: [0.5, 0.935]
      toi_chu: '^(\d{1,3}%|Taking you to Home.*|Result)$'
      dung_neu: "(Daily Free limit Reached|Daily Limit Reached|Today.s Free limit Reached)"
      mua_sub_chu: "^Unlock Now$"
      toi_da: 300
    - cho_chu: "^(Result|Hypix)$"
      toi_da: 330
    - cho: 60
      bo_qua_neu: "^Result$"
    - dong_neu_co: "^(Close|Close sheet)$"
      bo_qua_neu: "^Result$"
    - tap: "^History$"
      bo_qua_neu: "^Result$"
    - tap: "^(▶|Video)$"
      bo_qua_neu: "^Result$"
      toi_da: 90
    - cho_chu: "^Result$"
      toi_da: 60

# KHUON: app chua co muc rieng -> tool ve Home, chon khuon co `nhan_dien` khop chu tren Home (src/rcr/cong_thuc_khuon.py).
khuon:
  beauty:                      # AIP892 BeautyGenie: Home co hang "QUICK FIXES"
    nhan_dien: "^QUICK FIXES$"
    <<: *beauty
  ai_photo:                    # AIP893 / AIP885: Home co "Text to Image Generate" / "Magic With AI"; AIP944: "Trending Now"
    nhan_dien: "^(Text to Image Generate|Magic With AI|Trending Now)$"
    <<: *ai_photo
  studio_style:                # AIP919: tab "Image Studio" / "Video Studio", luoi the duoi "Explore styles"
    nhan_dien: "^Explore styles$"
    <<: *studio_style
  hypix:                       # AIP933 Hypix: Home "Hi dear" + "Hypix", tab duoi "AI Generate" / "AI Photos" / "AI Videos"
    nhan_dien: "^Hypix$"
    <<: *hypix
