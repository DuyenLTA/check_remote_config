com.ai.aiphoto.aivideo.creator.generator:
  khuon: ai_photo
  ep_cau_hinh:
    generating_wait_image_seconds: "60"
    generating_wait_video_seconds: "300"

# AIP919 AI Photo Video Maker 2.1.0 (do tren Pixel 7 29301FDH2006K7 20/11/2026): app Compose (moi man la
# AIP919AIPhotoVideoMakerMainActivity). Home = 2 tab duoi "Image Studio" / "Video Studio", moi tab co "Explore styles"
# + chip "All" / "Dance Trends" + luoi the style (the khong chu, chu ten nam trong the). Bam the -> inter -> thang
# photopicker he thong ("Xong") -> "Your photos" + "Confirm (1/1)" -> sheet "Unlock your Masterpiece" "Watch Ads (0/2)"
# (Unlock Now = paywall, KHONG bam: app Pro mat ads cho tab IAA) -> loading "<so>%" ~10s roi gen NGAM ve Home (badge 1 tren icon History khong chu) -> History
