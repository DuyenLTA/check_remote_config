    - dong_neu_co: "^(Close|Close sheet)$"
      bo_qua_neu: "^Result$"
    - tap: "^History$"
      bo_qua_neu: "^Result$"
    - tap: "^(▶|Image)$"
      bo_qua_neu: "^Result$"
      toi_da: 60
    - cho_chu: "^Result$"
      toi_da: 60
  video:
    - ve_chu: "^Hypix$"
      tab: "^AI Generate$"
      toi_da: 180
    - dong_neu_co: "^(Close|Close sheet)$"
