  ep_cau_hinh:
    generating_wait_image_seconds: "60"
    generating_wait_video_seconds: "300"
    free_image_generation_limit_per_day: "50"
    free_video_generation_limit_per_day: "50"
  anh:
    - ve_chu: "^Explore styles$"
      tab: "^Image Studio$"
      toi_da: 120
    - dong_neu_co: "^(Close|Close sheet)$"
    - tap: "^Image Studio$"
    - cho: 2
    - tap_duoi: "^All$"
    - dong_ad: 8
    - chon_anh: true
    - tap: "^Confirm( \\(\\d+/\\d+\\))?$"
    - xem_ads_chu: "^(Watch Ads.*|Free Generate)$"
      tap_tai: [0.5, 0.932]
      toi_chu: "^\\d{1,3}%$"
      dung_neu: "(Daily Free limit Reached|Daily Limit Reached|Today.s Free limit Reached)"
      toi_da: 300
    - cho_chu: "^(Result|Back to Home)$"
      toi_da: 120
  video:
    - ve_chu: "^Explore styles$"
      tab: "^Image Studio$"
      toi_da: 120
    - dong_neu_co: "^(Close|Close sheet)$"
    - tap: "^Video Studio$"
    - cho: 2
    - tap_duoi: "^All$"
    - dong_ad: 8
    - chon_anh: true
    - tap: "^Confirm( \\(\\d+/\\d+\\))?$"
    - xem_ads_chu: "^(Watch Ads.*|Free Generate)$"
      tap_tai: [0.5, 0.932]
      toi_chu: "^\\d{1,3}%$"
      dung_neu: "(Daily Free limit Reached|Daily Limit Reached|Today.s Free limit Reached)"
      toi_da: 300
    - cho_chu: "^(Result|Back to Home|Download)$"
      toi_da: 330

